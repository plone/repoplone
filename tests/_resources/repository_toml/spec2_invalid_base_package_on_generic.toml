# Generic packages have no ecosystem base package.
spec_version = "2"

[repository]
name = "acme-site"
changelog = "CHANGELOG.md"
version = "version.txt"

[[package]]
type = "python"
name = "acme.tooling"
path = "backend"
changelog = "backend/CHANGELOG.md"
towncrier_settings = "backend/pyproject.toml"
base_package = "Products.CMFPlone"
